<div class="announcements-layout" id="announcementsPanel">
  <aside class="announcements-list-pane" aria-label="Announcements list">
    <div class="announcements-list-pane__head">
      <h2 class="announcements-list-pane__title">Announcements</h2>
    </div>
    <div class="announcements-list" id="announcementsList" role="list">
      <div class="announcements-empty">
        <span class="spinner"></span>
      </div>
    </div>
  </aside>
  <section class="announcements-detail-pane" aria-label="Announcement detail">
    <div class="announcements-detail" id="announcementsDetail">
      <div class="announcements-detail__placeholder">
        <svg class="icon icon-lg" aria-hidden="true"><use href="#icon-megaphone"/></svg>
        <h3>Select an announcement</h3>
        <p>Platform updates and notices from RentACar appear here.</p>
      </div>
    </div>
  </section>
</div>
