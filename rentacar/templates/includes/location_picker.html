<div class="modal-bg" id="locationModal" hidden>
  <div class="modal modal--wide location-modal" role="dialog" aria-modal="true" aria-labelledby="locationModalTitle">
    <div class="modal-head">
      <h3 id="locationModalTitle">Choose your city</h3>
      <button type="button" class="btn-close-modal" data-modal-close aria-label="Close location picker">&times;</button>
    </div>
    <div class="modal-body location-modal__body">
      <div class="location-status" id="locationStatus">No city selected yet.</div>

      <div class="location-actions">
        <button type="button" class="btn btn-primary btn-sm" id="detectCityBtn">Detect my city</button>
        <button type="button" class="btn btn-outline btn-sm" id="clearCityBtn">Clear city</button>
      </div>

      <div class="form-group location-search-group">
        <label for="citySearchInput" class="form-label">Search city</label>
        <input
          type="search"
          class="search-input"
          id="citySearchInput"
          placeholder="Start typing a city name..."
          autocomplete="off"
        />
      </div>

      <div class="location-results" id="cityResults"></div>

      <p class="text-caption location-help">
        City search is proxied through our server (OpenStreetMap Nominatim). Listings are filtered by city name, not GPS radius.
      </p>
    </div>
  </div>
</div>
