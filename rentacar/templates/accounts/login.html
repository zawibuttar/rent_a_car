{% extends 'base.html' %}
{% block title %}Login — RentACar{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-box">

    <h1>Welcome back</h1>
    <p class="sub">Sign in to your RentACar account</p>

    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="form-control" type="text" id="username" placeholder="Enter your username" autofocus/>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-control" type="password" id="password" placeholder="Enter your password"/>
    </div>

    <div class="err-box" id="loginErr"></div>

    <button class="btn btn-primary btn-block btn-lg" id="loginBtn" onclick="doLogin()">
      Sign In
    </button>

    <div class="footer">
      Don't have an account? <a href="/register/">Create one free</a>
    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errBox   = document.getElementById('loginErr');
  const btn      = document.getElementById('loginBtn');

  errBox.style.display = 'none';

  if (!username || !password) {
    errBox.textContent    = 'Please enter your username and password.';
    errBox.style.display  = 'block';
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Signing in...';

  try {
    const data = await API.post('/api/accounts/login/', { username, password });
    API.save(data.token, data.user);
    toast('Login successful!', 'success');

    setTimeout(function() {
      const role = data.user.role;
      if      (role === 'owner') window.location.href = '/dashboard/owner/';
        else if (role === 'admin' || data.user.is_superuser) window.location.href = '/dashboard/admin/';
        else window.location.href = '/dashboard/customer/';
      }, 600);

    } catch(err) {
      errBox.textContent   = err.message;
      errBox.style.display = 'block';
      btn.disabled    = false;
      btn.textContent = 'Sign In';
    }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
{% endblock %}
