{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}RentACar{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>

<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="nav-brand">&#x1F697; RentACar</a>
      <a href="/" class="nav-link">Home</a>
      <a href="/cars/" class="nav-link">Browse Cars</a>

      <div class="nav-right">
        <span id="nav-guest" style="display:flex;gap:8px">
          <a href="/login/" class="btn btn-outline">Login</a>
          <a href="/register/" class="btn btn-primary">Register</a>
        </span>
        <span id="nav-auth" style="display:none;align-items:center;gap:10px">
          <a href="/dashboard/" class="btn btn-ghost" id="nav-dash-link">Dashboard</a>
          <span id="nav-uname" style="font-size:13px;color:var(--text-2)"></span>
          <div class="nav-avatar" id="nav-av"></div>
        </span>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <div class="footer">© 2025 RentACar. All rights reserved.</div>

  <script src="{% static 'js/api.js' %}"></script>
  <script>
    // Set dashboard link based on role
    document.addEventListener('DOMContentLoaded', function () {
      const role = API.role();
      const link = document.getElementById('nav-dash-link');
      if (link && role) {
        if (role === 'owner') link.href = '/dashboard/owner/';
        else if (role === 'admin') link.href = '/dashboard/admin/';
        else link.href = '/dashboard/customer/';
      }
      // Highlight active nav link
      document.querySelectorAll('.nav-link').forEach(a => {
        if (a.href === window.location.href) a.classList.add('active');
      });
    });
  </script>
  {% block scripts %}{% endblock %}

</body>

</html>
