{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>{% block title %}RentACar{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>

<body>
  {% include 'includes/icons.html' %}

  <nav class="navbar">
    <div class="navbar-inner">
      <button type="button" class="btn-icon nav-menu-btn" id="sidebarToggle" aria-label="Open menu"></button>
      <a href="/" class="nav-brand">
        <svg class="icon icon-brand" aria-hidden="true">
          <use href="#icon-logo" />
        </svg>
        <span class="nav-brand-text">RentACar</span>
      </a>
      <a href="/" class="nav-link">Home</a>
      <a href="/cars/" class="nav-link">Browse Cars</a>

      <div class="nav-right">
        <span class="nav-links-compact" aria-label="Quick navigation">
          <a href="/" class="btn-icon" aria-label="Home">
            <svg class="icon" aria-hidden="true">
              <use href="#icon-logo" />
            </svg>
          </a>
          <a href="/cars/" class="btn-icon" aria-label="Browse cars">
            <svg class="icon" aria-hidden="true">
              <use href="#icon-search" />
            </svg>
          </a>
        </span>
        <button type="button" class="btn btn-outline btn-sm location-toggle" data-location-toggle
          aria-label="Choose your city">Choose city</button>
        <button type="button" class="btn-icon theme-toggle" data-theme-toggle aria-label="Toggle theme"></button>
        <span id="nav-guest" class="nav-auth-group">
          <a href="/login/" class="btn btn-outline">Login</a>
          <a href="/register/" class="btn btn-primary">Register</a>
        </span>
        <span id="nav-auth" class="nav-auth-group is-hidden">
          <a href="/dashboard/" class="btn btn-ghost" id="nav-dash-link">Dashboard</a>
          <span id="nav-uname" class="nav-uname"></span>
          <div class="nav-avatar" id="nav-av"></div>
        </span>
      </div>
    </div>
  </nav>

  {% include 'includes/location_picker.html' %}

  {% block content %}{% endblock %}

  {% block footer %}{% endblock %}

  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/ui.js' %}"></script>
  <script src="{% static 'js/location.js' %}"></script>
  <script src="{% static 'js/footer.js' %}"></script>
  <script>
    window.STATIC_NO_IMAGE = "{% static 'images/no-image.svg' %}";
    document.addEventListener('DOMContentLoaded', function () {
      const y = document.getElementById('footerYear');
      if (y) y.textContent = new Date().getFullYear();
      const role = API.role();
      const link = document.getElementById('nav-dash-link');
      if (link && role) {
        if (role === 'owner') link.href = '/dashboard/owner/';
        else if (role === 'admin') link.href = '/dashboard/admin/';
        else link.href = '/dashboard/customer/';
      }
      // Show "My Orders" link only for logged-in customers (not admin or owner)
      const ordersLinks = document.querySelectorAll('.nav-orders-link');
      if (role && role === 'customer') {
        ordersLinks.forEach(function (el) { el.style.display = ''; });
      }
      function markNavActive(links) {
        links.forEach(function (a) {
          const href = a.getAttribute('href');
          const match = a.href === window.location.href
            || (href === '/cars/' && window.location.pathname.indexOf('/cars') === 0)
            || (href === '/bookings/my-bookings/' && window.location.pathname.indexOf('/bookings') === 0);
          if (match) {
            a.classList.add('active');
            a.setAttribute('aria-current', 'page');
          } else {
            a.classList.remove('active');
            a.removeAttribute('aria-current');
          }
        });
      }
      markNavActive(document.querySelectorAll('.nav-link'));
      markNavActive(document.querySelectorAll('.nav-links-compact a'));
      const menuBtn = document.getElementById('sidebarToggle');
      if (menuBtn) {
        menuBtn.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#icon-menu"/></svg>';
      }
    });
  </script>
  {% block scripts %}{% endblock %}

</body>

</html>
