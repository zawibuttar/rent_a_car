name: CI

on:
  push:
    branches: [main, master, develop, 'feature/**']
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rentacar_test
          POSTGRES_USER: rentacar_user
          POSTGRES_PASSWORD: rentacar_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentacar_user -d rentacar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: rentacar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
      - name: Django check
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: '1'
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: rentacar_test
          DB_USER: rentacar_user
          DB_PASSWORD: rentacar_pass
          DB_HOST: localhost
          DB_PORT: '5432'
        run: python manage.py check
      - name: Migrate
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: '1'
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: rentacar_test
          DB_USER: rentacar_user
          DB_PASSWORD: rentacar_pass
          DB_HOST: localhost
          DB_PORT: '5432'
        run: python manage.py migrate --noinput
      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: '1'
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: rentacar_test
          DB_USER: rentacar_user
          DB_PASSWORD: rentacar_pass
          DB_HOST: localhost
          DB_PORT: '5432'
        run: python manage.py test accounts cars bookings --verbosity=2
